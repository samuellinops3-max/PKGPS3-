name: Build PS3 PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make cmake python3 wget unzip

      - name: Instalar PSL1GHT
        run: |
          git clone https://github.com/ps3dev/PSL1GHT.git
          cd PSL1GHT
          export PSL1GHT=$GITHUB_WORKSPACE/PSL1GHT/build
          make
          make install

      - name: Compilar e gerar PKG
        run: |
          export PSL1GHT=$GITHUB_WORKSPACE/PSL1GHT/build
          export PATH=$PSL1GHT/bin:$PATH
          make
          make pkg

      - name: Publicar PKG
        uses: actions/upload-artifact@v4
        with:
          name: ps3-game-pkg
          path: |
            **/*.pkg