name: Teste Build PS3

on:
  push:
  workflow_dispatch:

jobs:
  build-ps3:
    runs-on: ubuntu-latest
    # Essa imagem é mantida oficialmente e atualizada direto pelos desenvolvedores do PS3 SDK
    container: ps3dev/ps3dev:latest

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Compilar e Gerar PKG Nativo
        run: |
          # No container oficial, as variáveis PS3DEV e PSL1GHT já vêm configuradas de fábrica!
          
          echo "=== 1. COMPILANDO O CÓDIGO FONTE ==="
          ppu-gcc -I$PSL1GHT/ppu/include -O2 -c source/main.c -o source/main.o
          
          echo "=== 2. GERANDO O EXECUTÁVEL ELF ==="
          ppu-gcc source/main.o -L$PSL1GHT/ppu/lib -lsl1ght -lvsh -lrt -lvf -lsysutil -lmodplay -lpng -lz -lm -o SlitherPS3.elf
          
          echo "=== 3. CONVERTENDO PARA SELF FORMA NATIVA ==="
          make_self SlitherPS3.elf SlitherPS3.self
          
          echo "=== 4. ESTRUTURA DO PACOTE ==="
          mkdir -p pkg/USRDIR
          cp SlitherPS3.self pkg/USRDIR/EBOOT.BIN
          
          echo "=== 5. GERANDO PKG INSTALÁVEL ==="
          pkg.py --content_id=UP0001-SLIT00001_00-0000000000000000 pkg/ SlitherPS3.pkg
          
          echo "=== 6. SEPARANDO ARQUIVOS ==="
          mkdir -p packages
          mv SlitherPS3.pkg packages/
          cp SlitherPS3.self packages/ 2>/dev/null || true

      - name: Enviar Artefatos (Packages)
        uses: actions/upload-artifact@v4
        with:
          name: SlitherPS3-Packages
          path: packages/
          if-no-files-found: error
