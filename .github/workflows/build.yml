name: Build SlitherPS3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl tar make

      - name: Download toolchain (working one)
        run: |
          mkdir -p $HOME/ps3dev
          cd /tmp
          # Toolchain estável usado por vários projetos
          wget -q https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz -O ps3dev.tar.gz
          tar -xzf ps3dev.tar.gz -C $HOME/
          # Ajusta caminho se necessário
          if [ -d $HOME/ps3dev ]; then
            echo "Toolchain encontrado em $HOME/ps3dev"
          else
            ls -la $HOME/
          fi

      - name: Build
        run: |
          export PS3DEV=$HOME/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          
          echo "=== Versão do compilador ==="
          ppu-gcc --version || echo "ppu-gcc não encontrado"
          
          echo "=== Arquivos do projeto ==="
          ls -la
          
          echo "=== Compilando ==="
          make clean || true
          make
          make pkg || true
          
          echo "=== Resultado ==="
          ls -la

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SlitherPS3
          path: |
            *.pkg
            *.self
            *.elf
          if-no-files-found: warn