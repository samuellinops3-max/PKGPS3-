name: Teste Build PS3

on:
  push:
  workflow_dispatch:

jobs:
  build-ps3:
    runs-on: ubuntu-latest
    
    # Executa todo o processo dentro de um container Docker do Ubuntu 18.04
    # Isso resolve de uma vez por todas o problema da falta de bibliotecas antigas (libssl1.1)
    container:
      image: ubuntu:18.04

    steps:
      - name: Instalar Ferramentas de Compilacao do Linux
        run: |
          apt-get update
          apt-get install -y wget curl tar make python3 git

      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Instalar Toolchain PS3 (Compilador)
        run: |
          # Baixa o compilador estável do PS3 direto no diretório do projeto
          curl -sL https://github.com | tar xvz -C ./
          # Ajusta a correção necessária na biblioteca do PSL1GHT
          curl -sL https://github.com -o ps3dev/ppu/include/sysutil/sysutil.h

      - name: Compilar e Organizar Pacotes
        run: |
          # Define os caminhos apontando para as ferramentas de desenvolvimento do PS3
          export PS3DEV=$GITHUB_WORKSPACE/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          
          echo "=== Testando Compilador ==="
          ppu-gcc --version
          
          echo "=== Iniciando Compilacao ==="
          make clean || true
          make
          
          echo "=== Gerando o Arquivo PKG ==="
          python3 $PS3DEV/bin/pkg.py --content_id=UP0001-SLIT00001_00-0000000000000000 . SlitherPS3.pkg || make pkg || true
          
          echo "=== Organizando Arquivos ==="
          mkdir -p packages
          mv *.pkg packages/ 2>/dev/null || echo "Nenhum arquivo .pkg encontrado na raiz."
          cp *.self *.elf packages/ 2>/dev/null || echo "Nenhum arquivo .self/.elf encontrado."
          
          echo "=== Conteudo Final da Pasta ==="
          ls -la packages/

      - name: Enviar Artefatos (Packages)
        uses: actions/upload-artifact@v4
        with:
          name: SlitherPS3-Packages
          path: packages/
          if-no-files-found: error
