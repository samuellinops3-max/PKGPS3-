name: Teste Build PS3

on:
  push:
  workflow_dispatch:

jobs:
  build-ps3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Instalar Dependencias do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl tar make python3

      - name: Instalar Toolchain PS3 Oficial (Estatico)
        run: |
          # URL COMPLETA CORRIGIDA: Baixa o SDK idêntico ao do projeto oficial do Bucanero
          curl -sL "https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz" | tar xvz -C ./
          
          # Corrige o cabeçalho sysutil necessário para a compilação
          curl -sL "https://github.com/ps3dev/PSL1GHT/raw/master/ppu/include/sysutil/sysutil.h" -o ps3dev/ppu/include/sysutil/sysutil.h

      - name: Compilar e Organizar Pacotes
        run: |
          # Vincula as pastas mapeando o compilador do PS3
          export PS3DEV=$GITHUB_WORKSPACE/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          
          echo "=== Testando Compilador ==="
          ppu-gcc --version
          
          echo "=== Iniciando Compilacao ==="
          make clean || true
          make
          
          echo "=== Gerando o Arquivo PKG ==="
          python3 $PS3DEV/bin/pkg.py --content_id=UP0001-SLIT00001_00-0000000000000000 . SlitherPS3.pkg || make pkg || true
          
          echo "=== Organizando Arquivos ==="
          mkdir -p packages
          mv *.pkg packages/ 2>/dev/null || echo "Nenhum arquivo .pkg encontrado na raiz."
          cp *.self *.elf packages/ 2>/dev/null || echo "Nenhum arquivo .self/.elf encontrado."
          
          echo "=== Conteudo Final da Pasta ==="
          ls -la packages/

      - name: Enviar Artefatos (Packages)
        uses: actions/upload-artifact@v4
        with:
          name: SlitherPS3-Packages
          path: packages/
          if-no-files-found: error
