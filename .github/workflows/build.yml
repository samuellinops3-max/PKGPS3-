name: Teste Build PS3

on:
  push:
  workflow_dispatch:

jobs:
  build-ps3:
    # Atualizado para ubuntu-latest para tirar o build do travamento da fila
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Instalar Dependencias do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl tar make build-essential

      - name: Compilar e Injetar libssl1.1 (Necessaria para o PS3 Toolchain)
        run: |
          cd /tmp
          # Baixa o codigo-fonte oficial da versao antiga do OpenSSL exigida pelo compilador do PS3
          wget https://openssl.org
          tar -xf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w
          # Compila e instala apenas a biblioteca compartilhada de forma ultra rapida
          ./config shared --prefix=/usr/local/ssl --openssldir=/usr/local/ssl
          make -j$(nproc)
          sudo make install_sw
          # Cria os links para o sistema reconhecer a biblioteca
          sudo ln -s /usr/local/ssl/lib/libssl.so.1.1 /usr/lib/libssl.so.1.1
          sudo ln -s /usr/local/ssl/lib/libcrypto.so.1.1 /usr/lib/libcrypto.so.1.1

      - name: Instalar Toolchain PS3
        run: |
          # Extrai o compilador do PS3 diretamente no workspace do projeto
          curl -sL https://github.com | tar xvz -C ./
          # Corrige o cabeçalho do SDK do PS3
          curl -sL https://github.com -o ps3dev/ppu/include/sysutil/sysutil.h

      - name: Compilar e Organizar Pacotes
        run: |
          export PS3DEV=$GITHUB_WORKSPACE/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          
          echo "=== Testando Compilador ==="
          ppu-gcc --version
          
          echo "=== Iniciando Compilacao ==="
          make clean || true
          make
          
          echo "=== Gerando o Arquivo PKG ==="
          python3 $PS3DEV/bin/pkg.py --content_id=UP0001-SLIT00001_00-0000000000000000 . SlitherPS3.pkg || make pkg || true
          
          echo "=== Organizando Arquivos ==="
          mkdir -p packages
          mv *.pkg packages/ 2>/dev/null || echo "Nenhum arquivo .pkg encontrado na raiz."
          cp *.self *.elf packages/ 2>/dev/null || echo "Nenhum arquivo .self/.elf encontrado."
          
          echo "=== Conteudo Final da Pasta ==="
          ls -la packages/

      - name: Enviar Artefatos (Packages)
        uses: actions/upload-artifact@v4
        with:
          name: SlitherPS3-Packages
          path: packages/
          if-no-files-found: error
