name: Build SlitherPS3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget tar

      - name: Download PS3DEV toolchain
        run: |
          mkdir -p $HOME/ps3dev
          cd /tmp
          # Baixa a última release (ajuste se precisar)
          wget -q https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-10-12/ps3dev-linux-x86_64.tar.gz -O ps3dev.tar.gz || \
          wget -q https://github.com/ps3dev/ps3dev/releases/latest/download/ps3dev-linux-x86_64.tar.gz -O ps3dev.tar.gz
          tar -xzf ps3dev.tar.gz -C $HOME/ps3dev --strip-components=1
          ls -la $HOME/ps3dev

      - name: Build
        run: |
          export PS3DEV=$HOME/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          
          echo "=== Verificando toolchain ==="
          ppu-gcc --version
          
          echo "=== Arquivos ==="
          ls -la
          
          echo "=== Compilando ==="
          make clean || true
          make
          make pkg || true
          
          echo "=== Resultado ==="
          ls -la

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SlitherPS3
          path: |
            *.pkg
            *.self
            *.elf
          if-no-files-found: warn