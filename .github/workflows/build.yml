name: Teste Build PS3

on:
  push:
  workflow_dispatch:

jobs:
  build-ps3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Instalar Dependencias do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl tar make python3

      - name: Instalar Toolchain PS3 Oficial (Estatico)
        run: |
          curl -sL "https://github.com" | tar xvz -C ./
          curl -sL "https://github.com" -o ps3dev/ppu/include/sysutil/sysutil.h

      - name: Compilar e Organizar Pacotes (Sem Makefile)
        run: |
          # Define as variáveis do PS3
          export PS3DEV=$GITHUB_WORKSPACE/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          
          echo "=== 1. COMPILANDO O CÓDIGO FONTE ==="
          ppu-gcc -I$PS3DEV/ppu/include -O2 -c source/main.c -o source/main.o
          
          echo "=== 2. GERANDO O EXECUTÁVEL ELF ==="
          ppu-gcc source/main.o -L$PS3DEV/ppu/lib -lsl1ght -lvsh -lrt -lvf -lsysutil -lmodplay -lpng -lz -lm -o SlitherPS3.elf
          
          echo "=== 3. CONVERTENDO PARA SELF (CONSOLE) ==="
          make_self SlitherPS3.elf SlitherPS3.self
          
          echo "=== 4. MONTANDO A ESTRUTURA DO PKG ==="
          mkdir -p pkg/USRDIR
          cp SlitherPS3.self pkg/USRDIR/EBOOT.BIN
          
          echo "=== 5. EMPACOTANDO EM PKG OFICIAL ==="
          python3 $PS3DEV/bin/pkg.py --content_id=UP0001-SLIT00001_00-0000000000000000 pkg/ SlitherPS3.pkg
          
          echo "=== 6. ORGANIZANDO PARA DOWNLOAD ==="
          mkdir -p packages
          mv SlitherPS3.pkg packages/
          cp SlitherPS3.self SlitherPS3.elf packages/ 2>/dev/null || true
          
          ls -la packages/

      - name: Enviar Artefatos (Packages)
        uses: actions/upload-artifact@v4
        with:
          name: SlitherPS3-Packages
          path: packages/
          if-no-files-found: error
